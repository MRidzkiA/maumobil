name: maumobil
description: "MauMobil - Aplikasi jual beli mobil baru dan bekas untuk pasar Indonesia. Tema aplikasi berubah mengikuti negara asal mobil (Jepang / Eropa)."
# publish_to: 'none' artinya app ini tidak akan dipublish ke pub.dev
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Tidak ada package lain. State management memakai ChangeNotifier
  # bawaan Flutter SDK saja (tanpa package provider),
  # supaya bisa jalan offline dan mudah dipelajari pemula.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Membuat ikon launcher Android dari assets/logo/maumobil-icon.png.
  # Jalankan: dart run flutter_launcher_icons
  # (setelah folder android/ dibuat dengan `flutter create .`).
  flutter_launcher_icons: ^0.13.1

# Konfigurasi ikon launcher (hanya Android; folder ios/ tidak ada di repo ini).
flutter_icons:
  android: true
  ios: false
  image_path: "assets/logo/maumobil-icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    # Logo utama MauMobil (dipakai di splash + header Beranda)
    - assets/logo/maumobil-logo.png
    # Ikon aplikasi (dipakai untuk ikon launcher via flutter_launcher_icons)
    - assets/logo/maumobil-icon.webp
    - assets/logo/maumobil-icon.png
